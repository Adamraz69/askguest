    <script>
      (function () {
        var KEY = "wisdomCircleSubmissions";
        var max = 2;

        var form = document.getElementById("q-form");
        var msg = document.getElementById("msg");
        var counter = document.getElementById("counter");
        var submitBtn = document.getElementById("submit-btn");
        var leadMaxNum = document.getElementById("lead-max-num");
        var textarea = document.getElementById("question");

        // Auto-resize textarea
        textarea.addEventListener("input", function () {
          this.style.height = "auto";
          this.style.height = Math.min(this.scrollHeight, 240) + "px";
        });

        function applyMax(n) {
          var m = parseInt(n, 10);
          if (isNaN(m) || m < 1) m = 2;
          if (m > 100) m = 100;
          max = m;
          if (leadMaxNum) leadMaxNum.textContent = String(max);
          refreshCounter();
        }

        function count() {
          var n = parseInt(sessionStorage.getItem(KEY) || "0", 10);
          if (isNaN(n) || n < 0) n = 0;
          return n;
        }

        function setCount(n) {
          sessionStorage.setItem(KEY, String(n));
        }

        function refreshCounter() {
          var c = count();
          counter.textContent = c + " / " + max;
        }

        function showMessage(text, isError) {
          msg.textContent = text;
          msg.className = "msg" + (isError ? " error" : " ok");
        }

        fetch("/api/public-config")
          .then(function (r) {
            return r.json();
          })
          .then(function (cfg) {
            if (cfg && cfg.maxSubmissionsPerSession != null) {
              applyMax(cfg.maxSubmissionsPerSession);
            } else {
              refreshCounter();
            }
          })
          .catch(function () {
            refreshCounter();
          });

        form.addEventListener("submit", function (e) {
          e.preventDefault();
          msg.textContent = "";
          msg.className = "msg";

          var c = count();
          if (c >= max) {
            showMessage("وصّلتي للحد ديال الإرسال فهاد الجلسة.", true);
            return;
          }

          var name = document.getElementById("name").value.trim();
          var question = document.getElementById("question").value.trim();
          if (!question) {
            showMessage("عطينا السؤال ديالك.", true);
            return;
          }

          submitBtn.disabled = true;

          fetch("/api/questions", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ name: name, question: question }),
          })
            .then(function (r) {
              return r.json().then(function (data) {
                if (!r.ok) throw new Error(data.error || "Request failed");
                return data;
              });
            })
            .then(function () {
              setCount(c + 1);
              refreshCounter();
              showMessage("شكراً! وصلنا السؤال ديالك ✅", false);
              form.reset();
              textarea.style.height = "auto";
            })
            .catch(function (err) {
              showMessage(err.message || "ما قدرناش نسيفطو. جرّب من بعد.", true);
            })
            .finally(function () {
              submitBtn.disabled = false;
            });
        });
      })();
    </script>
